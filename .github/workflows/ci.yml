name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    name: Lint, Prüfskripte, Tests, Bau
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Kontraste und Textregeln streng prüfen
        run: CHECK_STRICT=1 npm run check

      - name: Tests
        run: npm test

      - name: Produktionsbau
        run: npm run build

  lighthouse:
    name: Lighthouse auf vier Seiten
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node 22 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktionsbau
        run: npm run build

      - name: Server starten und auf Antwort warten
        run: |
          nohup npx next start -p 3000 > server.log 2>&1 &
          for versuch in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "Server antwortet nach Versuch $versuch."
              exit 0
            fi
            sleep 2
          done
          echo "Der Server hat nach 60 Sekunden nicht mit HTTP 200 geantwortet."
          cat server.log
          exit 1

      - name: Lighthouse messen
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/leistungen
            http://localhost:3000/karriere/software-developer
            http://localhost:3000/konzept
          configPath: .lighthouserc.json
          uploadArtifacts: true
